<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D校内マップ</title>
   
    <!-- Google official 3D viewer library -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 12px;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", MeiRyo, sans-serif;
            background-color: #e0f7fa; /* 爽やかなライトブルー背景 */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #004d40;
        }

        /* ヘッダー */
        header {
            margin-top: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            color: #006064;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        p.sub {
            margin: 6px 0 0 0;
            font-size: 13px;
            color: #00838f;
        }

        /* メインコンテナ（3Dエリア + サイドパネル） */
        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 94vw;
            max-width: 1200px;
        }

        @media (min-width: 900px) {
            .main-layout {
                flex-direction: row;
                align-items: stretch;
            }
        }

        /* 3D表示エリア */
        .viewer-container {
            position: relative;
            flex: 1;
            min-height: 480px;
            height: 70vh;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            border: 2px solid #b2ebf2;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        /* ホットスポット（3D空間上のピン） */
        .Hotspot {
            background: #00acc1;
            border-radius: 20px;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
            color: white;
            cursor: pointer;
            height: 32px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            transition: transform 0.2s, background-color 0.2s;
            white-space: nowrap;
        }

        .Hotspot:hover, .Hotspot:active {
            transform: scale(1.12);
            background: #00838f;
        }

        /* 通知・ファイル選択オーバーレイ */
        .notice-banner {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #00acc1;
            padding: 10px 18px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: #006064;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .notice-banner.hidden {
            display: none;
        }

        .upload-btn {
            background-color: #00acc1;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
        }

        .upload-btn:hover {
            background-color: #00838f;
        }

        #file-input {
            display: none;
        }

        /* サイドパネル（校舎選択メニュー） */
        .sidebar {
            width: 100%;
            background: #ffffff;
            border: 2px solid #b2ebf2;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        @media (min-width: 900px) {
            .sidebar {
                width: 320px;
            }
        }

        .sidebar-title {
            font-size: 15px;
            font-weight: bold;
            color: #006064;
            margin-bottom: 6px;
            border-bottom: 2px solid #e0f7fa;
            padding-bottom: 8px;
        }

        .sidebar-desc {
            font-size: 12px;
            color: #00838f;
            margin-bottom: 12px;
        }

        .building-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 520px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .building-list::-webkit-scrollbar {
            width: 6px;
        }
        .building-list::-webkit-scrollbar-thumb {
            background-color: #b2ebf2;
            border-radius: 4px;
        }

        .building-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 10px 12px;
            background: #f0fdfa;
            border: 1px solid #b2ebf2;
            border-radius: 8px;
            color: #006064;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .building-btn:hover {
            background: #e0f7fa;
            transform: translateY(-1px);
        }

        .badge {
            background: #00acc1;
            color: white;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
        }

        /* モーダル共通スタイル */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 30, 40, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            max-width: 420px;
            width: 100%;
            padding: 24px;
            text-align: center;
            position: relative;
            animation: popIn 0.2s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            font-size: 22px;
            color: #888;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #333;
        }

        .floor-btn-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 16px;
        }

        .floor-select-btn {
            width: 100%;
            padding: 12px;
            background: #00acc1;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .floor-select-btn:hover {
            background: #00838f;
        }

        /* 見取り図モーダル */
        .map-modal-card {
            background: white;
            border-radius: 16px;
            max-width: 850px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .map-header {
            background: #006064;
            color: white;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
        }

        .map-tabs {
            display: flex;
            gap: 8px;
            background: #e0f7fa;
            padding: 8px 16px;
            border-bottom: 1px solid #b2ebf2;
            overflow-x: auto;
        }

        .tab-btn {
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid #00acc1;
            background: white;
            color: #006064;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: #00acc1;
            color: white;
        }

        .map-body {
            background: #f8fafc;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 320px;
            overflow: auto;
        }

        .map-footer {
            padding: 12px 20px;
            background: #f0fdfa;
            border-top: 1px solid #b2ebf2;
            font-size: 12px;
            color: #006064;
        }

        .room-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .room-tag {
            background: #e0f7fa;
            border: 1px solid #00acc1;
            color: #006064;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }

        /* フッター */
        footer {
            margin-top: 14px;
            margin-bottom: 10px;
            font-size: 12px;
            color: #006064;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <header>
        <h1>🏫 近大高専キャンパスマップ</h1>
        <p class="sub">校舎のピンまたはメニューから見取り図を開くことができます</p>
    </header>

    <!-- メインレイアウト -->
    <div class="main-layout">
        
        <!-- 3Dビューワーエリア -->
        <div class="viewer-container">
            
            <!-- 案内バナー & テスト用ファイル選択ボタン -->
            <div id="notice-banner" class="notice-banner hidden">
                <span>⚠️ school.glb が見つからないか、テスト環境です</span>
                <label class="upload-btn">
                    3Dファイル (.glb) を選択
                    <input type="file" id="file-input" accept=".glb,.gltf">
                </label>
            </div>

            <!-- 3Dモデル表示タグ (ご指定の座標・設定を適用した10棟分のピン配置) -->
            <model-viewer
                id="school-viewer"
                camera-controls
                shadow-intensity="0.5"
                exposure="1"
                camera-orbit="0deg 55deg 12m">

                <!-- 10棟のホットスポット (3D空間上のピン) -->
                <button class="Hotspot" slot="hotspot-bldg-1" data-position="-76m 16m -30m" data-normal="0m 1m 0m" onclick="openFloorSelector('本館')">
                     本館
                </button>
                <button class="Hotspot" slot="hotspot-bldg-2" data-position="-18m 16m -30m" data-normal="0m 1m 0m" onclick="openFloorSelector('1号館')">
                     1号館
                </button>
                <button class="Hotspot" slot="hotspot-bldg-3" data-position="9m 16m 0m" data-normal="0m 1m 0m" onclick="openFloorSelector('2号館')">
                     2号館
                </button>
                <button class="Hotspot" slot="hotspot-bldg-4" data-position="18m 16m -18m" data-normal="0m 1m 0m" onclick="openFloorSelector('3号館')">
                     3号館
                </button>
                <button class="Hotspot" slot="hotspot-bldg-5" data-position="25m 16m -35m" data-normal="0m 1m 0m" onclick="openFloorSelector('4号館')">
                     4号館
                </button>
                <button class="Hotspot" slot="hotspot-bldg-6" data-position="-40m 16m 30m" data-normal="0m 1m 0m" onclick="openFloorSelector('高専会館')">
                     高専会館
                </button>
                <button class="Hotspot" slot="hotspot-bldg-7" data-position="-41m 16m -30m" data-normal="0m 1m 0m" onclick="openFloorSelector('図書館')">
                     図書館
                </button>
                <button class="Hotspot" slot="hotspot-bldg-8" data-position="58m 16m -8m" data-normal="0m 1m 0m" onclick="openFloorSelector('体育館')">
                     体育館
                </button>
                <button class="Hotspot" slot="hotspot-bldg-9" data-position="58m 16m -34m" data-normal="0m 1m 0m" onclick="openFloorSelector('学生会館')">
                     学生会館
                </button>
                <button class="Hotspot" slot="hotspot-bldg-10" data-position="80m 16m -7m" data-normal="0m 1m 0m" onclick="openFloorSelector('武道場')">
                     武道場
                </button>
                
            </model-viewer>
            
        </div>

        <!-- サイドバー：全10棟の校舎一覧リスト -->
        <div class="sidebar">
            <div>
                <div class="sidebar-title"> 校舎一覧</div>
                <div class="sidebar-desc">校舎を選択すると階ごとのフロアマップが開きます。</div>

                <div class="building-list">
                    <button class="building-btn" onclick="openFloorSelector('本館')">
                        <span> 本館</span>
                        <span class="badge">1〜4階</span>
                    </button>
                    <button class="building-btn" onclick="openFloorSelector('1号館')">
                        <span> 1号館</span>
                        <span class="badge">1〜2階</span>
                    </button>
                    <button class="building-btn" onclick="openFloorSelector('2号館')">
                        <span> 2号館</span>
                        <span class="badge">1〜3階</span>
                    </button>
                    <button class="building-btn" onclick="openFloorSelector('3号館')">
                        <span> 3号館</span>
                        <span class="badge">1〜3階</span>
                    </button>
                    <button class="building-btn" onclick="openFloorSelector('4号館')">
                        <span> 4号館</span>
                        <span class="badge">1〜2階</span>
                    </button>
                    <button class="building-btn" onclick="openFloorSelector('高専会館')">
                        <span> 高専会館</span>
                    </button>
                    <button class="building-btn" onclick="openFloorSelector('図書館')">
                        <span> 図書館</span>
                        <span class="badge">1〜2階</span>
                    </button>
                    <button class="building-btn" onclick="openFloorSelector('体育館')">
                        <span> 体育館</span>
                    </button>
                    <button class="building-btn" onclick="openFloorSelector('学生会館')">
                        <span> 学生会館</span>
                        <span class="badge">1〜3階</span>
                    </button>
                    <button class="building-btn" onclick="openFloorSelector('武道場')">
                        <span> 武道場</span>
                    </button>
                </div>
            </div>

        </div>

    </div>

    <!-- 階数選択モーダル -->
    <div id="floor-modal" class="modal-overlay">
        <div class="modal-card">
            <button class="close-btn" onclick="closeModal('floor-modal')">&times;</button>
            <h3 id="modal-building-name" style="margin: 0 0 4px 0; color: #006064;">校舎名</h3>
            <p style="font-size: 12px; color: #00838f; margin: 0 0 16px 0;">確認したい階数を選んでください</p>
            <div id="floor-buttons-container" class="floor-btn-grid">
                <!-- JavaScriptで動的生成 -->
            </div>
        </div>
    </div>

    <!-- 見取り図表示モーダル -->
    <div id="map-modal" class="modal-overlay">
        <div class="map-modal-card">
            <div class="map-header">
                <span id="map-modal-title">校舎名 - 見取り図</span>
                <button class="close-btn" style="color: white; position: static;" onclick="closeModal('map-modal')">&times;</button>
            </div>
            
            <div id="map-tabs-container" class="map-tabs">
                <!-- 階数切替タブをJavaScriptで追加 -->
            </div>

            <div class="map-body" id="map-body-content">
                <!-- 画像またはSVGが挿入される -->
            </div>

            <div class="map-footer">
                <div id="room-list-container" class="room-tags">
                    <!-- 部屋一覧タグ -->
                </div>
            </div>
        </div>
    </div>


    <script>

        // 各校舎・階数ごとの画像ファイルパスの設定
        const floorPlanImages = {
            '本館': {
                1: 'images/本館_1F.png',
                2: 'images/本館_2F.png',
                3: 'images/本館_3F.png',
                4: 'images/本館_4F.png'
            },
            '1号館': {
                1: 'images/1号館_1F.png',
                2: 'images/1号館_2F.png'
            },
            '2号館': {
                1: 'images/2号館_1F.png',
                2: 'images/2号館_2F.png',
                3: 'images/2号館_3F.png'
            },
            '3号館': {
                1: 'images/3号館_1F.png',
                2: 'images/3号館_2F.png',
                3: 'images/3号館_3F.png'
            },
            '4号館': {
                1: 'images/4号館_1F.png',
                2: 'images/4号館_2F.png'
            },
            '高専会館': {
                1: 'images/高専会館.png'
            },
            '図書館': {
                1: 'images/図書館_1F.png',
                2: 'images/図書館_2F.png'
            },
            '体育館': {
                1: 'images/体育館.png'
            },
            '学生会館': {
                1: 'images/学生会館_1F.png',
                2: 'images/学生会館_2F.png',
                3: 'images/学生会館_3F.png'
            },
            '武道場': {
                1: 'images/武道場.png'
            }
        };
// 校舎・階数ごとのデータ構造
        const schoolData = {
            '本館': {
                floors: [1, 2, 3, 4],
                rooms: {
                    1: ['Now Loading'],
                    2: ['Now Loading'],
                    3: ['Now Loading'],
                    4: ['Now Loading']
                }
            },
            '1号館': {
                floors: [1, 2],
                rooms: {
                    1: ['Now Loading'],
                    2: ['Now Loading']
                }
            },
            '2号館': {
                floors: [1, 2, 3],
                rooms: {
                    1: ['Now Loading'],
                    2: ['Now Loading'],
                    3: ['Now Loading']
                }
            },
            '3号館': {
                floors: [1, 2, 3],
                rooms: {
                    1: ['Now Loading'],
                    2: ['Now Loading'],
                    3: ['Now Loading']
                }
            },
            '4号館': {
                floors: [1, 2],
                rooms: {
                    1: ['Now Loading'],
                    2: ['Now Loading']
                }
            },
            '高専会館': {
                floors: [1, 2],
                rooms: {
                    1: ['Now Loading'],
                    2: ['Now Loading']
                }
            },
            '図書館': {
                floors: [1, 2],
                rooms: {
                    1: ['Now Loading'],
                    2: ['Now Loading']
                }
            },
            '体育館': {
                floors: [1],
                rooms: {
                    1: ['Now Loading']
                }
            },
            '学生会館': {
                floors: [1, 2, 3],
                rooms: {
                    1: ['Now Loading'],
                    2: ['Now Loading'],
                    3: ['Now Loading']
                }
            },
            '武道場': {
                floors: [1],
                rooms: {
                    1: ['Now Loading']
                }
            }
        };

        
        let currentBuilding = '';
        let currentFloor = 1;

        // ページ初期化処理
        document.addEventListener('DOMContentLoaded', () => {
            init3DViewer();
        });

        // 3Dモデル読み込みとエラー判定
        function init3DViewer() {
            const viewer = document.getElementById('school-viewer');
            const banner = document.getElementById('notice-banner');
            const fileInput = document.getElementById('file-input');
            const targetFileName = '学校.glb';

            try {
                const currentHref = window.location.href;
                if (currentHref.startsWith('http://') || currentHref.startsWith('https://')) {
                    viewer.src = new URL(targetFileName, currentHref).href;
                } else {
                    banner.classList.remove('hidden');
                }
            } catch (e) {
                banner.classList.remove('hidden');
            }

            viewer.addEventListener('error', () => {
                banner.classList.remove('hidden');
            });

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    viewer.src = URL.createObjectURL(file);
                    banner.classList.add('hidden');
                }
            });
        }

        // 階数選択モーダルを開く
        function openFloorSelector(buildingName) {
            currentBuilding = buildingName;
            const bData = schoolData[buildingName] || { floors: [1], rooms: { 1: ['案内なし'] } };

            document.getElementById('modal-building-name').textContent = buildingName;
            const container = document.getElementById('floor-buttons-container');
            container.innerHTML = '';

            // 単一階の場合は直接見取り図を開く
            if (bData.floors.length === 1) {
                openMapModal(buildingName, 1);
                return;
            }

            // 階数ボタンを動的生成
            bData.floors.forEach(floor => {
                const btn = document.createElement('button');
                btn.className = 'floor-select-btn';
                btn.textContent = `${floor} 階`;
                btn.onclick = () => {
                    closeModal('floor-modal');
                    openMapModal(buildingName, floor);
                };
                container.appendChild(btn);
            });

            document.getElementById('floor-modal').classList.add('active');
        }

        // 見取り図表示モーダルを開く
        function openMapModal(buildingName, floor) {
            currentBuilding = buildingName;
            currentFloor = floor;
            const bData = schoolData[buildingName] || { floors: [1], rooms: { 1: ['案内なし'] } };

            document.getElementById('map-modal-title').textContent = `${buildingName} - ${floor}階 見取り図`;

            // 階数切替タブの生成
            const tabsContainer = document.getElementById('map-tabs-container');
            tabsContainer.innerHTML = '';
            
            bData.floors.forEach(f => {
                const tabBtn = document.createElement('button');
                tabBtn.className = `tab-btn ${f === floor ? 'active' : ''}`;
                tabBtn.textContent = `${f}階`;
                tabBtn.onclick = () => {
                    openMapModal(buildingName, f);
                };
                tabsContainer.appendChild(tabBtn);
            });

            // 見取り図コンテンツの描画
            renderMapContent(buildingName, floor);

            // 部屋タグの描画
            renderRoomTags(buildingName, floor);

            document.getElementById('map-modal').classList.add('active');
        }

        // 見取り図の画像ロード処理
        function renderMapContent(building, floor) {
            const container = document.getElementById('map-body-content');
            
            // 設定テーブルから画像のパスを取得（未登録の場合はデフォルト指定）
            let imagePath = '';
            if (floorPlanImages[building] && floorPlanImages[building][floor]) {
                imagePath = floorPlanImages[building][floor];
            } else {
                imagePath = `images/${building}_${floor}F.png`;
            }

            container.innerHTML = `
                <img src="${imagePath}" 
                     alt="${building} ${floor}階 見取り図" 
                     style="max-width: 100%; max-height: 460px; border-radius: 8px; object-fit: contain;"
                     onerror="renderSVGFallback(this, '${building}', ${floor})">
            `;
        }

        // 画像が見つからない場合のフォールバック（仮の図面を表示）
        function renderSVGFallback(imgElem, building, floor) {
            const container = imgElem.parentElement;
            const rooms = (schoolData[building] && schoolData[building].rooms[floor]) 
                ? schoolData[building].rooms[floor] 
                : ['部屋A', '部屋B'];

            const roomBoxes = rooms.map((r, i) => {
                const x = 40 + (i % 3) * 180;
                const y = 70 + Math.floor(i / 3) * 100;
                return `
                    <g transform="translate(${x}, ${y})">
                        <rect width="160" height="80" rx="8" fill="#ffffff" stroke="#00acc1" stroke-width="2"/>
                        <text x="80" y="45" font-family="sans-serif" font-size="13" font-weight="bold" fill="#006064" text-anchor="middle" dominant-baseline="middle">${r}</text>
                    </g>
                `;
            }).join('');

            container.innerHTML = `
                <div style="width: 100%; text-align: center;">
                    <div style="font-size: 11px; color: #00838f; margin-bottom: 8px;">
                        ※ <code>${imgElem.src}</code> が見つからないため、簡易レイアウトを表示しています
                    </div>
                    <svg viewBox="0 0 600 320" style="width: 100%; max-height: 380px; background: #e0f7fa; border-radius: 12px; border: 1px dashed #00acc1;">
                        <rect x="15" y="15" width="570" height="290" rx="12" fill="none" stroke="#00838f" stroke-width="2" stroke-dasharray="4 4"/>
                        <text x="30" y="40" font-family="sans-serif" font-size="13" font-weight="bold" fill="#006064">📌 【レイアウト構造図】 ${building} ${floor}階</text>
                        ${roomBoxes}
                    </svg>
                </div>
            `;
        }

        // 部屋タグの挿入
        function renderRoomTags(building, floor) {
            const container = document.getElementById('room-list-container');
            container.innerHTML = '';

            const rooms = (schoolData[building] && schoolData[building].rooms[floor]) 
                ? schoolData[building].rooms[floor] 
                : ['案内データなし'];

            rooms.forEach(r => {
                const tag = document.createElement('span');
                tag.className = 'room-tag';
                tag.textContent = r;
                container.appendChild(tag);
            });
        }

        // モーダルを閉じる
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }
    </script>
</body>
</html>
